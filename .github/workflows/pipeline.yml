def lambda_handler(event, context):
    query_params = event.get('queryStringParameters') or {}
    
    if query_params.get('action') == 'status':
        target_pipeline = "DemoPipeline"
        status = "UNKNOWN"
        exec_id = "N/A"
        timestamp = "N/A"
        commit_msg = "N/A"
        author = "N/A"
        
        try:
            res = table.query(
                KeyConditionExpression=Key('PipelineName').eq(target_pipeline),
                ScanIndexForward=False,
                Limit=10
            )
            items = res.get('Items', [])
            if items:
                items.sort(key=lambda x: x.get('Timestamp', ''), reverse=True)
                latest = items[0]
                status = latest.get('State', 'UNKNOWN')
                exec_id = latest.get('ExecutionId', 'N/A')
                timestamp = latest.get('Timestamp', 'N/A')
                commit_msg = latest.get('CommitMessage', 'N/A')
                author = latest.get('Author', 'N/A')
        except Exception as e:
            status = "ERROR"
            exec_id = str(e)
            
        return {
            'statusCode': 200,
            'headers': {'Content-Type': 'application/json', 'Access-Control-Allow-Origin': '*'},
            'body': json.dumps({
                'pipeline': target_pipeline,
                'status': status,
                'exec_id': exec_id,
                'timestamp': timestamp,
                'commit_msg': commit_msg,
                'author': author
            })
        }
    
    return {
        'statusCode': 200,
        'headers': {'Content-Type': 'text/html'},
        'body': HTML_PAGE
    }
